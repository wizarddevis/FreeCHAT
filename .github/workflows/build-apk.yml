name: Build FreeCHAT APK
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - uses: actions/setup-java@v4
        with: { distribution: 'temurin', java-version: '17' }
      - uses: android-actions/setup-android@v3
      - run: npm install
      - run: npm run build || true
      - run: |
          npm install @capacitor/core @capacitor/cli @capacitor/android @capacitor/assets
          npx cap init FreeCHAT com.wizarddevis.freechat --web-dir=out || npx cap init FreeCHAT com.wizarddevis.freechat --web-dir=dist || npx cap init FreeCHAT com.wizarddevis.freechat --web-dir=build || true
          mkdir -p resources
          cp icon.png resources/icon.png || true
          npx capacitor-assets generate --android || true
          npx cap add android
          npx cap copy android || true
          cd android
          chmod +x gradlew
       ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: FreeCHAT-APK
          path: android/app/build/outputs/apk/debug/*.apk
